<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Gear/Circuit Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#mainGradient)" stroke-width="12" stroke-opacity="0.3" />
  <path d="M256 36 A220 220 0 0 1 476 256" fill="none" stroke="url(#mainGradient)" stroke-width="8" stroke-dasharray="20 40" stroke-linecap="round" />
  <path d="M256 476 A220 220 0 0 1 36 256" fill="none" stroke="url(#mainGradient)" stroke-width="8" stroke-dasharray="20 40" stroke-linecap="round" />
  
  <!-- Tech Circuit Nodes -->
  <circle cx="256" cy="36" r="8" fill="#06b6d4" />
  <circle cx="476" cy="256" r="8" fill="#10b981" />
  <circle cx="256" cy="476" r="8" fill="#10b981" />
  <circle cx="36" cy="256" r="8" fill="#06b6d4" />
  
  <!-- Central 'A' Design -->
  <g transform="translate(156, 120) scale(0.8)">
    <path d="M125 0 L250 300 L200 300 L175 240 L75 240 L50 300 L0 300 Z" fill="url(#mainGradient)" filter="url(#glow)" />
    <!-- Circuit lines inside A -->
    <path d="M125 60 L125 180" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <circle cx="125" cy="180" r="12" fill="#0f172a" />
    <path d="M85 240 L165 240" stroke="#0f172a" stroke-width="4" />
  </g>
  
  <!-- Circuit Traces connecting to A -->
  <path d="M36 256 L156 256" fill="none" stroke="url(#mainGradient)" stroke-width="4" stroke-opacity="0.5" />
  <path d="M476 256 L356 256" fill="none" stroke="url(#mainGradient)" stroke-width="4" stroke-opacity="0.5" />
  <circle cx="156" cy="256" r="4" fill="#06b6d4" />
  <circle cx="356" cy="256" r="4" fill="#10b981" />

</svg>
